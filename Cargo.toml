[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15"
lazy_static = "1.5.0"
axum = "0.8.8"
tokio = { version = "1.49", features = ["full"] }
tower-http = { version = "0.6.8", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-axum = { version = "0.2.0" }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde_yaml ={ version = "0.9.33" }
argon2 = { version = "0.5", features = ["std"] }
diesel = { version = "2.3.5", features = ["postgres", "r2d2", "chrono", "uuid"] }
chrono = { version = "0.4.43", features = ["serde", "std", "now"] }
validator = { version = "0.20.0", features = ["derive"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
oauth2 = { version = "5.0.0", features = ["reqwest", "rustls-tls"] }
async-trait = "0.1.89"
reqwest = { version = "0.12.24", features = ["json"] }
criterion = { version = "0.7.0", features = ["async_tokio", "html_reports"] }
redis = "0.32.7"

[[bin]]
name = "openapi-gen"
path = "src/bin/openapi-gen.rs"

[profile.release]
debug = true

