[env]
RUST_BACKTRACE = "1"
 
[tasks.run]
command = "cargo"
args = ["run", "--bin", "backend"]

[tasks.build]
command = "cargo"
args = ["build", "--release"]

[tasks.test]
command = "cargo"
args = ["test", "--all-features"]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps"]

[tasks.openapi]
description = "生成 OpenAPI 文档"
command = "cargo"
args = ["run", "--bin", "openapi-gen"]